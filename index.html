<body style="margin:0;background:#f8faff;font-family:'Segoe UI',Arial,sans-serif">
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState } = React;
function fmt(n){return '£'+Math.round(n).toLocaleString('en-GB');}

function calcCT(profits, assocCompanies) {
  const divisor = assocCompanies + 1;
  const lower = 50000 / divisor;
  const upper = 250000 / divisor;

  let tax, rate, marginalRelief = 0;

  if (profits <= lower) {
    rate = 0.19;
    tax = profits * rate;
  } else if (profits >= upper) {
    rate = 0.25;
    tax = profits * rate;
  } else {
    // Marginal relief: 25% on all profits less marginal relief fraction
    // MRF = (U - P) / U * (P / AP) × 3/200 — simplified for standard case
    const mainTax = profits * 0.25;
    marginalRelief = (upper - profits) * (profits / profits) * (3/200) * (upper / 1) ;
    // Correct HMRC formula: MRF = (upper - augmented profits) × standard fraction (3/200)
    marginalRelief = (upper - profits) * 3/200;
    tax = mainTax - marginalRelief;
    rate = tax / profits;
  }

  return { tax: Math.max(0,tax), effectiveRate: profits>0?tax/profits*100:0, marginalRelief, band: profits<=lower?'Small profits (19%)':profits>=upper?'Main rate (25%)':'Marginal relief band' };
}

function App() {
  const [profits, setProfits] = useState(120000);
  const [assoc, setAssoc] = useState(0);

  const p = Number(profits)||0;
  const r = calcCT(p, Number(assoc)||0);
  const netProfit = p - r.tax;

  return (
    <div style={{maxWidth:520,margin:'0 auto',paddingBottom:40}}>
      <div style={{background:'#1a1a2e',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <a href="https://tabutility.com" style={{color:'#a5b4fc',textDecoration:'none',fontSize:14}}>← All Tools</a>
        <span style={{color:'#fff',fontWeight:700,fontSize:15}}>⚡ Tabutility</span>
      </div>
      <div style={{background:'linear-gradient(135deg,#0f172a,#1e293b)',padding:'28px 20px',textAlign:'center',color:'#fff'}}>
        <div style={{fontSize:36,marginBottom:8}}>🏢</div>
        <h1 style={{margin:'0 0 6px',fontSize:22,fontWeight:900}}>UK Corporation Tax Calculator</h1>
        <p style={{margin:0,fontSize:13,opacity:0.85}}>2025/26 — Small profits 19% · Main rate 25% · Marginal relief</p>
      </div>
      <div style={{padding:20}}>
        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Taxable Profits (12-month period)</label>
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b7280'}}>£</span>
              <input type="number" value={profits} onChange={e=>setProfits(e.target.value)}
                style={{width:'100%',padding:'11px 12px 11px 28px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
            </div>
          </div>
          <div>
            <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Associated Companies (besides yours)</label>
            <input type="number" value={assoc} onChange={e=>setAssoc(e.target.value)} min={0}
              style={{width:'100%',padding:'11px 12px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
            <div style={{fontSize:11,color:'#9ca3af',marginTop:4}}>Associated companies divide the £50k/£250k thresholds</div>
          </div>
        </div>

        <div style={{background:r.effectiveRate<=19?'linear-gradient(135deg,#f0fdf4,#dcfce7)':r.effectiveRate>=25?'linear-gradient(135deg,#fef2f2,#fee2e2)':'linear-gradient(135deg,#fef3c7,#fde68a)',borderRadius:14,padding:24,textAlign:'center',marginBottom:16}}>
          <div style={{fontSize:12,fontWeight:700,color:'#374151',marginBottom:4}}>{r.band.toUpperCase()}</div>
          <div style={{fontSize:13,fontWeight:700,color:'#6b7280',marginBottom:4}}>CORPORATION TAX DUE</div>
          <div style={{fontSize:48,fontWeight:900,color:'#0f172a',margin:'6px 0'}}>{fmt(r.tax)}</div>
          <div style={{fontSize:14,color:'#6b7280'}}>Effective rate: {r.effectiveRate.toFixed(2)}%</div>
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
          {[
            ['Taxable Profits', fmt(p)],
            ['Tax Band', r.band],
            ['Corporation Tax', fmt(r.tax)],
            ...(r.marginalRelief>0?[['Marginal Relief Deduction', '-'+fmt(r.marginalRelief)]]:[]),
            ['Effective Rate', r.effectiveRate.toFixed(2)+'%'],
            ['Net Profit After Tax', fmt(netProfit)],
          ].map(([l,v])=>(
            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid #f0f0f0',fontSize:14}}>
              <span style={{color:'#6b7280'}}>{l}</span><strong>{v}</strong>
            </div>
          ))}
        </div>

        <div style={{background:'#f8fafc',borderRadius:12,padding:16,marginTop:16,fontSize:13,color:'#374151',lineHeight:1.6}}>
          <strong>2025/26:</strong> Profits ≤ £50,000 → 19%. Profits ≥ £250,000 → 25%. Between: marginal relief applies (effective rate tapers up). Thresholds divided by number of associated companies + 1. CT must be paid 9 months and 1 day after year end (small companies).
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
//]]>
</script>
